<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Auth State Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Frontend Authentication State Test</h1>
    
    <div class="section info">
        <h3>Current Auth State</h3>
        <button onclick="checkAuthState()">Check Auth State</button>
        <div id="authState"></div>
    </div>
    
    <div class="section">
        <h3>Test Login</h3>
        <input type="email" id="email" placeholder="Email" value="admin@qoderfakerun.com">
        <input type="password" id="password" placeholder="Password" value="gogo">
        <button onclick="testLogin()">Test Login</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="section">
        <h3>Test Route Save</h3>
        <button onclick="testRouteSave()">Test Route Save</button>
        <div id="routeResult"></div>
    </div>
    
    <div class="section">
        <h3>Local Storage</h3>
        <button onclick="checkLocalStorage()">Check Local Storage</button>
        <div id="storageResult"></div>
    </div>

    <script>
        async function checkAuthState() {
            const authStateDiv = document.getElementById('authState');
            
            try {
                // Check if we can access the auth store from the window
                const authData = localStorage.getItem('auth-storage');
                
                authStateDiv.innerHTML = `
                    <h4>Local Storage Auth Data:</h4>
                    <pre>${authData ? JSON.stringify(JSON.parse(authData), null, 2) : 'No auth data found'}</pre>
                `;
                
                // Test profile endpoint
                if (authData) {
                    const parsed = JSON.parse(authData);
                    if (parsed.state && parsed.state.token) {
                        const response = await fetch('/api/auth/profile', {
                            headers: { 'Authorization': `Bearer ${parsed.state.token}` }
                        });
                        const result = await response.json();
                        
                        authStateDiv.innerHTML += `
                            <h4>Profile API Test:</h4>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        `;
                    }
                }
            } catch (error) {
                authStateDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Simulate storing in localStorage like the auth store would
                    const authData = {
                        state: {
                            token: result.data.token,
                            user: result.data.user,
                            isAuthenticated: true
                        },
                        version: 0
                    };
                    localStorage.setItem('auth-storage', JSON.stringify(authData));
                    
                    resultDiv.innerHTML = `<div class="success">Login successful! Token stored.</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">Login failed: ${result.error}</div>`;
                }
                
                resultDiv.innerHTML += `<pre>${JSON.stringify(result, null, 2)}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testRouteSave() {
            const resultDiv = document.getElementById('routeResult');
            
            try {
                const authData = localStorage.getItem('auth-storage');
                if (!authData) {
                    resultDiv.innerHTML = `<div class="error">No auth data found. Please login first.</div>`;
                    return;
                }
                
                const parsed = JSON.parse(authData);
                const token = parsed.state?.token;
                
                if (!token) {
                    resultDiv.innerHTML = `<div class="error">No token found in auth data.</div>`;
                    return;
                }
                
                const response = await fetch('/api/routes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        name: 'Frontend Test Route',
                        description: 'Testing route save from frontend',
                        routeData: {
                            points: [
                                { lat: 44.8125, lng: 20.4612, elevation: 100 },
                                { lat: 44.8135, lng: 20.4622, elevation: 105 }
                            ],
                            distance: 1000,
                            duration: 600,
                            elevationGain: 50,
                            averagePace: 6
                        },
                        activityType: 'run',
                        isPublic: true,
                        tags: ['frontend-test'],
                        chartData: [
                            { distance: 0, pace: 6, elevation: 100 },
                            { distance: 1000, pace: 6, elevation: 105 }
                        ],
                        date: '2025-08-27',
                        startTime: '10:00'
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="success">Route saved successfully!</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">Route save failed: ${result.error || result.message}</div>`;
                }
                
                resultDiv.innerHTML += `<pre>${JSON.stringify(result, null, 2)}</pre>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        function checkLocalStorage() {
            const resultDiv = document.getElementById('storageResult');
            
            const keys = Object.keys(localStorage);
            let storageData = {};
            
            keys.forEach(key => {
                try {
                    storageData[key] = JSON.parse(localStorage.getItem(key));
                } catch {
                    storageData[key] = localStorage.getItem(key);
                }
            });
            
            resultDiv.innerHTML = `<pre>${JSON.stringify(storageData, null, 2)}</pre>`;
        }
        
        // Auto-check auth state on load
        window.onload = () => {
            checkAuthState();
            checkLocalStorage();
        };
    </script>
</body>
</html>
